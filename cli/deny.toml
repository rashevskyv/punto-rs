[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    # ksni (значок в трее KDE).
    "Unlicense",
    # unicode-ident (через syn при сборке).
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Трей тянет zbus и tray-icon: дубли версий syn/miniz_oxide неизбежны.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
